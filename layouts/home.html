{{ define "header" }}
<header class="intro-header home-header" style="background-image: url('{{ .Site.Params.header_image | relURL }}')">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1">
                <div class="site-heading">
                    <h1>{{ .Site.Title }}</h1>
                    <span class="subheading">{{ .Site.Params.slogan }}</span>
                </div>
            </div>
        </div>
    </div>
</header>
{{ end }}

{{ define "main" }}
<main id="main-content" class="site-main home-main">
    <div class="container home-content">
        <div class="row">
            <div class="col-xs-12 post-container home-content__body content-panel">
                {{ .Content }}
            </div>
        </div>
    </div>
    {{ partial "portfolio.html" . }}
</main>
{{ end }}
