<a class="feature-card" href="{{ .Get "href" | relURL }}">
    <span class="feature-card__eyebrow">{{ .Get "eyebrow" }}</span>
    <span class="feature-card__title">{{ .Get "title" }}</span>
    <span class="feature-card__text">{{ .Get "text" }}</span>
    <span class="feature-card__action">Explore <span aria-hidden="true">→</span></span>
</a>
